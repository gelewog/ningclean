name: Deploy API to Railway

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd apps/api
          npm install
          
      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate
          
      - name: Build
        run: |
          cd apps/api
          npm run build
          
      - name: Deploy to Railway
        uses: railway/cli@v3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "@ningclean/api"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
