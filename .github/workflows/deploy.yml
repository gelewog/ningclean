name: Deploy All Apps to Vercel

on:
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - Check Secrets
        run: |
          echo "Checking if secrets are set..."
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then echo "❌ VERCEL_TOKEN is missing"; exit 1; fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then echo "❌ VERCEL_ORG_ID is missing"; exit 1; fi
          if [ -z "${{ secrets.VERCEL_API_PROJECT_ID }}" ]; then echo "❌ VERCEL_API_PROJECT_ID is missing"; exit 1; fi
          echo "✅ All required secrets are set"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy API
        working-directory: ./apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          echo "🚀 Deploying API..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ API deployment failed!"
            cat deploy.log
            exit 1
          fi
          echo "✅ API deployed successfully"

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd apps/admin && npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Admin
        working-directory: ./apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          echo "🚀 Deploying Admin..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Admin deployment failed!"
            cat deploy.log
            exit 1
          fi
          echo "✅ Admin deployed successfully"

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd apps/web && npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Web
        working-directory: ./apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "🚀 Deploying Web..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Web deployment failed!"
            cat deploy.log
            exit 1
          fi
          echo "✅ Web deployed successfully"
