name: Deploy to Vercel

on:
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy API (Vercel handles build)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          echo "🚀 Triggering Vercel deployment for API..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd ./apps/api

  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    needs: deploy-api
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          echo "🚀 Triggering Vercel deployment for Admin..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd ./apps/admin

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: deploy-api
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "🚀 Triggering Vercel deployment for Web..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd ./apps/web
