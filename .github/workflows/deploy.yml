name: Deploy Admin & Web to Vercel

on:
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Deploy Admin to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (root)
        run: |
          # Skip postinstall scripts to avoid prisma errors in root
          npm ci --ignore-scripts

      - name: Install Dependencies (admin)
        run: npm ci
        working-directory: ./apps/admin

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Admin
        working-directory: ./apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          echo "🚀 Deploying Admin to Vercel..."
          # Clear any existing env vars to avoid secret reference issues
          vercel env ls --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null | grep NEXT_PUBLIC_API_URL && vercel env rm NEXT_PUBLIC_API_URL production --token=${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          # Deploy with build env (no project env storage)
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }} --build-env NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy-web:
    name: Deploy Web to Vercel  
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (root)
        run: |
          # Skip postinstall scripts to avoid prisma errors in root
          npm ci --ignore-scripts

      - name: Install Dependencies (web)
        run: npm ci
        working-directory: ./apps/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Web
        working-directory: ./apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          echo "🚀 Deploying Web to Vercel..."
          # Create env file for deployment
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env.local
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
