name: Deploy Admin & Web to Vercel

on:
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-admin:
    name: Deploy Admin to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (root)
        run: npm ci

      - name: Install Dependencies (admin)
        run: npm ci
        working-directory: ./apps/admin

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Admin
        working-directory: ./apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
        run: |
          echo "🚀 Deploying Admin to Vercel..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-web:
    name: Deploy Web to Vercel  
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies (root)
        run: npm ci

      - name: Install Dependencies (web)
        run: npm ci
        working-directory: ./apps/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Web
        working-directory: ./apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "🚀 Deploying Web to Vercel..."
          vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
